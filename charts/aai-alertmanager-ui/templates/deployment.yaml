apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alerts.fullname" . }}
  labels:
    {{- include "alerts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alerts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alerts.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alerts
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ default (printf "v%s" .Chart.AppVersion) .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ALERTMANAGER_URL
              value: {{ required "alertmanager.url is required: set the existing Alertmanager service URL" .Values.alertmanager.url | quote }}
            {{- if .Values.prometheus.url }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: ":8080"
            {{- if kindIs "bool" .Values.readOnly }}
            - name: READ_ONLY
              value: {{ .Values.readOnly | quote }}
            {{- end }}
            {{- if .Values.basePath }}
            - name: BASE_PATH
              value: {{ .Values.basePath | quote }}
            {{- end }}
            {{- if .Values.config.existingSecret }}
            - name: CONFIG_FILE
              value: /etc/alerts/config.yaml
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.config.existingSecret .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.config.existingSecret }}
            - name: config
              mountPath: /etc/alerts
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.config.existingSecret .Values.extraVolumes }}
      volumes:
        {{- if .Values.config.existingSecret }}
        - name: config
          secret:
            secretName: {{ .Values.config.existingSecret | quote }}
            items:
              - key: {{ .Values.config.key | quote }}
                path: config.yaml
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
