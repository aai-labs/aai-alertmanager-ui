{{- if and .Values.enhanced.enabled (not .Values.enhanced.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "alerts.fullname" . }}-data
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "alerts.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.enhanced.persistence.storageClass }}
  storageClassName: {{ .Values.enhanced.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.enhanced.persistence.size }}
{{- end }}
