name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0); CI must have passed for its commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate version
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - name: Test and compile
        run: |
          make test
          (cd web && npm audit --audit-level=high)
          make build
          make helm-check
          python3 scripts/compatibility.py --binary .build/alertmanager-ui --versions 0.27.0 0.34.1
      - name: Browser interaction tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Scan image before publication
        run: docker build -t alerts:release .
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: alerts:release
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Package standalone binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            folder="aai-alertmanager-ui_${RELEASE_TAG}_${os}_${arch}"
            mkdir -p "dist/$folder/fonts"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$folder/alertmanager-ui" ./cmd/alertmanager-ui
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "dist/$folder/"
            cp design-system/*-OFL.txt "dist/$folder/fonts/"
            tar -czf "dist/$folder.tar.gz" -C dist "$folder"
            rm -rf "dist/$folder"
          done
          helm package charts/aai-alertmanager-ui --version "${RELEASE_TAG#v}" --app-version "${RELEASE_TAG#v}" --destination dist
      - name: Generate software inventory
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: alerts:release
          format: spdx-json
          output-file: dist/image-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.tgz *.json > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aai-labs/aai-alertmanager-ui:${{ inputs.tag }}
          sbom: true
          provenance: mode=max
      - name: Publish Helm package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/aai-alertmanager-ui-${RELEASE_TAG#v}.tgz" oci://ghcr.io/aai-labs/charts
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes dist/*
